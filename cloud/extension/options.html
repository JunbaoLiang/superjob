<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 380px; margin: 0; padding: 16px 18px; font: 13px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #1b2027; }
    h1 { font-size: 15px; color: #22568f; margin: 0 0 10px; }
    label { display: block; font-size: 12px; color: #5c6675; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #e2e6ec; border-radius: 8px; font: inherit; }
    button { margin-top: 14px; width: 100%; padding: 9px; border: none; border-radius: 8px; background: #22568f; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
    button:disabled { opacity: .55; }
    #msg { margin-top: 10px; font-size: 12px; min-height: 16px; }
    .ok { color: #2e7d5b; } .err { color: #b4472f; }
    .tip { font-size: 11px; color: #5c6675; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Job Copilot 云端配置</h1>
  <label>API 地址(Render 服务)</label>
  <input id="apiUrl" placeholder="https://job-copilot-api-xxxx.onrender.com">
  <label>面板地址(Vercel)</label>
  <input id="panelUrl" placeholder="https://job-copilot-xxxx.vercel.app">
  <label>访问口令(Render 环境变量 APP_TOKEN)</label>
  <input id="token" type="password" placeholder="APP_TOKEN">
  <button id="save">测试并保存</button>
  <div id="msg"></div>
  <p class="tip">三个值在部署指南(cloud/DEPLOY.md)的最后一步都能找到。</p>
  <script src="options.js"></script>
</body>
</html>
